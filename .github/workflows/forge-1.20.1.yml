name: Build WWOO Forge 1.20.1
on:
  push:
    branches: [forge-1.20.1-port]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check resource schema conversions
        run: python3 -m unittest discover -s forge/tests -v
      - name: Compile and reobfuscate Forge mod
        run: ./gradlew --no-daemon build --console=plain
      - name: Audit release JAR
        run: python3 forge/audit.py
      - name: Upload Forge mod and audit
        uses: actions/upload-artifact@v4
        with:
          name: WWOO-3.0.1-backport-Forge-1.20.1
          path: |
            build/libs/*.jar
            forge/build/content-report.json
            forge/build/jar-audit.json
          if-no-files-found: error
          retention-days: 30
