name: Audit Ancient City Overhaul compatibility

on:
  push:
    branches: ["compat/dnt-audit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare official 1.21.1 DnT files with WWOO
        run: python3 tests/dnt_city_audit.py
