name: Build WWOO 3.0.1 backport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Fabric 1.21.1 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Minecraft and Fabric build dependencies
        run: python3 port/bootstrap.py

      - name: Build WWOO for Fabric 1.21.1
        run: python3 port/build.py

      - name: Validate resulting JAR
        run: |
          python3 -m zipfile -t wwoo-fabric-1.21.1-3.0.1-backport.jar
          python3 tests/pack_priority.py
          python3 tests/resource_conflicts.py
          python3 tests/dry_foliage.py
          python3 tests/ice_preservation.py
          sha256sum wwoo-fabric-1.21.1-3.0.1-backport.jar

      - name: Compile biome-size integration probe
        run: python3 tests/build_biome_size_probe.py

      - name: Validate biome-size screen fields and saving
        run: python3 tests/biome_size_screen.py

      - name: Download tested TrueVanillaBackport Fabric dependency
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: VanillaBackport-1.21.1-fabric
          repository: dfgdrfgh/TrueVanillaBackport
          run-id: 38104289390
          github-token: ${{ github.token }}
          path: test-runtime/vanillabackport-artifact

      - name: Prepare dedicated-server runtime dependencies
        run: python3 tests/prepare_biome_size_runtime.py

      - name: Test biome scales with real dedicated-server mixins
        run: python3 tests/biome_size.py

      - name: Upload biome-size test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-size-test-logs
          path: test-runtime/biome-size-audit-*/**/console.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WWOO-3.0.1-backport-Fabric-1.21.1
          path: wwoo-fabric-1.21.1-3.0.1-backport.jar
          if-no-files-found: error
          retention-days: 30

