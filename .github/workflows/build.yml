name: Build WWOO 3.0.1 backport

on:
  push:
    branches: [main, fix/expanded-overworld-height, test/modrinth-height-with-vanillabackport]
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated CI builds on a branch or pull request. Keep manually
# dispatched runs and tagged releases from being canceled automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  build:
    name: Build Fabric 1.21.1 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Minecraft and Fabric build dependencies
        run: python3 port/bootstrap.py

      - name: Build WWOO for Fabric 1.21.1
        run: python3 port/build.py

      - name: Inspect compatibility pack selection metadata
        run: python3 tests/inspect_compat_metadata.py

      - name: Validate resulting JAR
        run: |
          python3 -m zipfile -t wwoo-fabric-1.21.1-3.0.1-backport.jar
          python3 tests/pack_priority.py
          python3 tests/resource_conflicts.py
          python3 tests/dry_foliage.py
          python3 tests/ice_preservation.py
          python3 tests/world_height_audit.py
          python3 port/smoke.py test-extended-height height
          python3 port/smoke.py test-modrinth-2032 modrinth
          # Use the latest successfully built Fabric 1.21.1 fork artifact.
          # It must be downloaded into test-dependencies before the mod test.
          echo "Modrinth standalone height regression completed."
          python3 tests/pale_garden_spawning.py
          python3 tests/cloud_baseline.py
          python3 tests/cloud_baseline_runtime.py
          sha256sum wwoo-fabric-1.21.1-3.0.1-backport.jar

      - name: Fetch TrueVanillaBackport 1.21.1 Fabric artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41093367986 --repo dfgdrfgh/TrueVanillaBackport --name VanillaBackport-1.21.1-fabric --dir test-dependencies
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json
          candidates=[p for p in Path('test-dependencies').rglob('*.jar') if p.name!='cristellib-fabric-1.21.1-3.1.7.jar']
          accepted=[]
          for p in candidates:
              with zipfile.ZipFile(p) as jar:
                  if 'fabric.mod.json' not in jar.namelist():continue
                  meta=json.loads(jar.read('fabric.mod.json'))
                  if meta.get('id')=='vanillabackport':accepted.append(p)
          assert len(accepted)==1, 'Expected exactly one Fabric VanillaBackport JAR: '+repr(candidates)
          jar=accepted[0]
          target=Path('test-dependencies/vanillabackport-testing.jar')
          if jar!=target:jar.replace(target)
          print('VANILLABACKPORT_TEST_JAR',target, target.stat().st_size)
          PY

      - name: Install required Platform library for VanillaBackport
        run: python3 tests/download_platform.py test-dependencies

      - name: Test Modrinth Y2032 with WWOO and VanillaBackport
        run: python3 port/smoke.py test-modrinth-2032-with-tvb modrinth

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WWOO-3.0.1-backport-Fabric-1.21.1
          path: wwoo-fabric-1.21.1-3.0.1-backport.jar
          if-no-files-found: error
          retention-days: 30


  standalone-client:
    name: Real 1.21.1 Fabric client without VanillaBackport
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the tested WWOO production JAR
        uses: actions/download-artifact@v4
        with:
          name: WWOO-3.0.1-backport-Fabric-1.21.1
          path: run/mods
      - name: Add Cristel Lib and verify VanillaBackport is absent
        shell: bash
        run: |
          set -euo pipefail
          cp test-dependencies/cristellib-fabric-1.21.1-3.1.7.jar run/mods/
          mapfile -t jars < <(find run/mods -maxdepth 1 -type f -name '*.jar' | sort)
          test "${#jars[@]}" -eq 2
          for jar in "${jars[@]}"; do jar tf "$jar" >/dev/null; sha256sum "$jar"; done
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          jars=list(Path('run/mods').glob('*.jar'))
          ids=[json.loads(zipfile.ZipFile(jar).read('fabric.mod.json'))['id'] for jar in jars]
          assert set(ids)=={'wwoo','cristellib'}, ids
          print('WWOO standalone loadout:',ids,'without vanillabackport')
          PY
      - name: Prepare virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch WWOO in a real singleplayer world
        uses: headlesshq/mc-runtime-test@645691de43520240e1d1e45b4b9a4d9cd9c294a4 # v4.5.2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        with:
          mc: '1.21.1'
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          java: '21'
          fabric-api: '0.116.17'
          fabric-gametest-api: none
          xvfb: true
          headlessmc-command: '--retries 3 --jvm -Djava.awt.headless=true -DMcRuntimeGameTest=false'
          cache-mc: github

